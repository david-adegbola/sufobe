<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mistä puu tulee?</title>
  <meta name="description" content="Guided-discovery simulation: watch carbon travel from the air into a birch tree and back.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Kieli / Language">
      <button type="button" data-lang="fi">FI</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <nav class="steps" id="steps" aria-label="Steps"></nav>

  <main class="layout">
    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="scene" role="img"></canvas>
        <div class="hud">
          <span id="hud-date" class="chip"></span>
          <span id="hud-stomata" class="chip"></span>
        </div>
      </div>
      <div id="controls" class="controls"></div>
    </section>
    <section class="panel" id="panel"></section>
  </main>

  <footer class="foot">
    <details id="teacher">
      <summary id="teacher-summary"></summary>
      <div id="teacher-body"></div>
    </details>
    <details id="privacy">
      <summary id="privacy-summary"></summary>
      <div id="privacy-body"></div>
    </details>
  </footer>

  <script src="js/model.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
